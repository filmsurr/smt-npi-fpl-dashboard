<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMT NPI FPL Dashboard</title><style>
:root{--bg:#061221;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--text:#f5f8ff;--muted:#94a3b8;--orange:#f1a455;--red:#ef6c75;--green:#49c987;--cyan:#56cbe8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#061221,#0a1b30);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1380px;margin:auto;padding:26px 18px 48px}.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(16px)}h1{margin:0;font-size:42px}.sub{color:var(--muted);font-size:13px;margin-top:7px}.section{margin-top:22px}.title{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:900;margin-bottom:10px}.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:16px}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.big{font-size:28px;font-weight:950;margin-top:8px}.team{font-size:11px;color:var(--muted)}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-size:10px;text-transform:uppercase}.red{color:var(--red);font-weight:900}.orange{color:var(--orange);font-weight:900}.green{color:var(--green);font-weight:900}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(241,164,85,.1);color:var(--orange);font-size:10px;font-weight:900}.pill.final{background:rgba(73,201,135,.1);color:var(--green)}.penaltyhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.audit{padding:13px;margin-top:10px;border:1px solid rgba(241,164,85,.25);background:rgba(241,164,85,.05);border-radius:14px}.controls{display:flex;gap:8px;align-items:center}.controls select{background:#102238;color:white;border:1px solid var(--line);border-radius:10px;padding:8px}.note{font-size:11px;color:var(--muted);margin-top:8px}@media(max-width:900px){.hero{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.hero{grid-template-columns:1fr}.penaltyhead{flex-direction:column}}
</style></head><body><div class="shell"><header><h1 id="league">SMT NPI FPL</h1><div class="sub" id="meta">League 754393</div></header><div id="error"></div><main id="main" hidden>
<section class="section"><div class="title">League Position</div><div id="hero" class="hero"></div></section>
<section class="section"><div class="penaltyhead"><div><div class="title">Penalty Zone & Financial Management</div><div class="sub">Penalty score = official net FPL points after transfer-hit deductions</div></div><div class="controls"><label>Period <select id="month"></select></label></div></div><div id="penalty" class="glass card"></div></section>
<section class="section"><div class="title">Season Penalty Leaderboard</div><div class="glass table"><table><thead><tr><th>#</th><th>Manager</th><th>Times</th><th>Paid</th><th>Current est.</th></tr></thead><tbody id="ledger"></tbody></table></div></section>
<section class="section"><div class="title">All-manager scoreboard</div><div class="glass table"><table><thead><tr><th>#</th><th>Manager</th><th>GW raw</th><th>GW net</th><th>Transfer hit</th><th>Total</th><th>Captain</th><th>MVP</th><th>Team value</th></tr></thead><tbody id="score"></tbody></table></div></section>
<section class="section"><div class="title">Audit</div><div id="audit"></div></section>
</main></div><script>window.FPL_DASHBOARD_DATA=null;</script><script src="dashboard_data.js"></script><script>
(()=>{const D=window.FPL_DASHBOARD_DATA||{},$=x=>document.getElementById(x),n=v=>v==null?'—':Number(v).toLocaleString(),money=v=>`${n(v)} THB`,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(D.status!=='ok'){$('error').innerHTML=`<div class="audit"><b>Dashboard data unavailable</b><div class="sub">${esc(D.error||'Run fpl_dashboard_updater.py')}</div></div>`;return}$('main').hidden=false;$('league').textContent=D.league.league_name;$('meta').textContent=`${D.league.season} · League ${D.league.league_id} · ${D.league.manager_count} managers · latest completed GW${D.latest_gw}`;const s=D.standings||[];$('hero').innerHTML=s.slice(0,3).map((r,i)=>`<div class="glass card"><div class="label">${['🏆 League 1st','🥈 League 2nd','🥉 League 3rd'][i]}</div><div class="big">${esc(r.manager_name)}</div><div class="team">${esc(r.team_name)}</div><div class="big">${n(r.total_points)} pts</div><div class="note">GW${D.latest_gw}: ${n(r.gw_points)} raw · ${n(r.net_gw_points)} net</div></div>`).join('')+`<div class="glass card"><div class="label">💰 Prize Pool Funding</div><div class="big green">${money(D.financial.collected_penalty_thb)}</div><div class="note">Projected current month: <span class="orange">+${money(D.financial.projected_current_period_thb)}</span></div><div class="note">Target: ${money(D.financial.season_target_thb)}</div></div>`;const periods=D.penalty_periods||[];periods.forEach((p,i)=>$('month').insertAdjacentHTML('beforeend',`<option value="${i}">${p.month} ${p.year} · GW${p.start_gw}–${p.end_gw}</option>`));let idx=periods.findIndex(p=>p.start_gw<=D.latest_gw&&D.latest_gw<=p.end_gw);if(idx<0)idx=Math.max(0,periods.length-1);$('month').value=idx;function renderPenalty(){const p=periods[Number($('month').value)]||{};if(p.status==='not_started'){$('penalty').innerHTML='<b>Not started</b>';return}if(p.status==='tie_review'){$('penalty').innerHTML=`<div class="audit"><b>Manual review required</b><div class="sub">${esc(p.reason)}</div></div>`;return}const rows=(p.entries||[]).map(x=>`<tr><td><b>${esc(x.manager_name)}</b><div class="team">${esc(x.team_name)}</div></td><td>${n(x.raw_points)}</td><td class="red">${x.transfer_hits?'-'+n(x.transfer_hits):'0'}</td><td><b>${n(x.monthly_points)}</b></td><td class="red">${n(x.monthly_penalty_gap)}</td><td class="orange">${money(x.penalty_thb)}</td></tr>`).join('');$('penalty').innerHTML=`<div class="penaltyhead"><div><b>${esc(p.month)} ${p.year} Penalty Zone</b><div class="sub">${esc(p.score_basis||'')}</div></div><span class="pill ${p.status==='finalized'?'final':''}">${p.status==='finalized'?'FINAL':'PROJECTED'} · ${p.penalty_teams} teams · ${money(p.penalty_pool_thb)}</span></div><div class="table" style="margin-top:12px"><table><thead><tr><th>Manager</th><th>Raw pts</th><th>Transfer hits</th><th>Penalty score</th><th>Gap</th><th>${p.status==='finalized'?'Final':'Estimated'} pay</th></tr></thead><tbody>${rows}</tbody></table></div>`}$('month').onchange=renderPenalty;renderPenalty();const current=periods.find(p=>p.start_gw<=D.latest_gw&&D.latest_gw<=p.end_gw),est={};(current?.entries||[]).forEach(x=>est[x.manager_id]=x.penalty_thb);$('ledger').innerHTML=[...(D.penalty_ledger||[])].sort((a,b)=>b.total_penalty_paid_thb-a.total_penalty_paid_thb).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.manager_name)}</td><td>${n(x.times_penalized)}</td><td>${money(x.total_penalty_paid_thb)}</td><td class="orange">${est[x.manager_id]?`+${money(est[x.manager_id])}`:'—'}</td></tr>`).join('');$('score').innerHTML=s.map(r=>`<tr><td>${r.league_rank}</td><td>${esc(r.manager_name)}</td><td>${n(r.gw_points)}</td><td>${n(r.net_gw_points)}</td><td class="red">${r.transfer_cost?'-'+n(r.transfer_cost):'0'}</td><td>${n(r.total_points)}</td><td>${n(r.captain_points_cumulative)}</td><td>${n(r.gw_mvp_wins_cumulative)}</td><td>£${Number(r.team_value).toFixed(1)}m</td></tr>`).join('');$('audit').innerHTML=(D.audit||[]).length?(D.audit||[]).map(a=>`<div class="audit"><b>${esc(a.code)}</b><div class="sub">${esc(a.message)}</div></div>`).join(''):'<div class="audit"><b class="green">No validation warnings</b></div>'})();
</script></body></html>
